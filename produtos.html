<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechFusion | Produtos</title>

<link rel="stylesheet" href="produtos.css">

</head>

<body>

<header>

<h1>TechFusion - Cadastro de Produtos</h1>

<a href="dashboard.html">
<button class="botao-voltar">⬅ Voltar</button>
</a>

</header>


<main>


<section class="cadastro">


<h2 id="titulo-form">Cadastrar Produto</h2>


<form id="form-produto">


<input type="hidden" id="produto-id">



<div class="linha-inputs">


<div class="grupo-input">


<label>Foto do Produto</label>
<input type="file" id="foto" accept="image/*">


<label>Marca</label>
<input type="text" id="marca" required>


<label>Modelo</label>
<input type="text" id="modelo" required>


</div>



<div class="grupo-input">


<label>Cor</label>
<input type="text" id="cor" required>


<label>Categoria</label>
<input type="text" id="categoria" required>


<label>Quantidade</label>
<input type="number" id="quantidade" required>


</div>



<div class="grupo-input">


<label>Preço de Custo</label>
<input type="number" step="0.01" id="preco-custo" required>


<label>Preço de Venda</label>
<input type="number" step="0.01" id="preco-venda" required>


<label>Descrição</label>
<textarea id="descricao"></textarea>


</div>


</div>



<div class="botoes">


<button type="submit" id="btn-salvar">

💾 Salvar Produto

</button>


<button type="button" id="btn-cancelar">

Cancelar

</button>


</div>


</form>


</section>




<section class="estoque">


<h2>Estoque Atual</h2>



<div class="filtros">


<input 
type="text"
id="busca-nome"
placeholder="Pesquisar produto">



<input
type="text"
id="filtro-categoria"
placeholder="Filtrar categoria">


</div>




<table>


<thead>

<tr>

<th>Foto</th>
<th>Produto</th>
<th>Cor</th>
<th>Categoria</th>
<th>Qtd</th>
<th>Custo</th>
<th>Venda</th>
<th>Ações</th>

</tr>

</thead>



<tbody id="tabela-produtos">

</tbody>


</table>


</section>


</main>



<script src="produtos.js"></script>


</body>

</html>
