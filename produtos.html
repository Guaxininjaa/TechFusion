<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFusion | Produtos e Peças</title>
</head>
<body>

    <h1>TechFusion - Produtos e Peças</h1>
    <a href="dashboard.html"><button>⬅ Voltar para a Home</button></a>
    <hr>

    <h2 id="titulo-form">Cadastrar Novo Produto</h2>
    
    <!-- Formulário distribuído em 3 colunas -->
    <form id="form-produto">
        <input type="hidden" id="produto-id">

        <table border="0" cellpadding="5">
            <tr>
                <!-- Coluna 1 -->
                <td>
                    <label>Foto do Produto:</label><br>
                    <input type="file" id="foto" accept="image/*"><br><br>

                    <label>Marca:</label><br>
                    <input type="text" id="marca" required><br><br>

                    <label>Modelo:</label><br>
                    <input type="text" id="modelo" required><br><br>

                    <label>Cor:</label><br>
                    <input type="text" id="cor" required>
                </td>

                <!-- Coluna 2 -->
                <td>
                    <label>Categoria:</label><br>
                    <input type="text" id="categoria" placeholder="Digite a categoria" required><br><br>

                    <label>Quantidade:</label><br>
                    <input type="number" id="quantidade" required><br><br>

                    <label>Preço de Custo (R$):</label><br>
                    <input type="number" step="0.01" id="preco-custo" required><br><br>

                    <label>Preço de Venda (R$):</label><br>
                    <input type="number" step="0.01" id="preco-venda" required>
                </td>

                <!-- Coluna 3 -->
                <td style="vertical-align: top;">
                    <label>Descrição do Produto:</label><br>
                    <textarea id="descricao" rows="10" cols="30" placeholder="Digite as características, detalhes e observações..."></textarea>
                </td>
            </tr>
        </table>

        <br>
        <button type="submit" id="btn-salvar">Salvar Produto</button>
        <button type="button" id="btn-cancelar" style="display:none;">Cancelar Edição</button>
    </form>

    <br><hr><br>

    <!-- Botão para abrir/fechar o estoque -->
    <button id="btn-toggle-estoque" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">📂 Abrir / Ver Estoque Atual</button>

    <!-- Área de Leitura e Filtros -->
    <div id="secao-estoque" style="display: none; margin-top: 20px;">
        <h2>Estoque Atual</h2>
        
        <label>Pesquisar por nome:</label>
        <input type="text" id="busca-nome" placeholder="Digite para buscar...">

        <label>Filtrar por Categoria:</label>
        <input type="text" id="filtro-categoria" placeholder="Filtrar categoria...">
        <br><br>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Marca / Modelo</th>
                    <th>Cor</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Custo</th>
                    <th>Venda</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos">
                <!-- Inserido via JS -->
            </tbody>
        </table>
    </div>

    <script src="produtos.js"></script>
</body>
</html>
