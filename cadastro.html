<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechFusion | Primeiro Acesso</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="cadastro.css">

</head>
<body>

<div class="container">
<div class="left">
<div class="content">
<h1>TechFusion</h1>

<p>
Configure sua empresa para começar a utilizar o sistema.
</p>

</div>

</div>

<div class="right">

<form class="login" id="cadastroForm">

<h2>Primeiro Acesso</h2>

<div class="input">
<i class="fa-solid fa-building"></i>
<input type="text" id="empresa" placeholder="Nome da Empresa" required>
</div>

<div class="input">
<i class="fa-solid fa-id-card"></i>
<input type="text" id="cnpj" placeholder="CNPJ" required>
</div>

<div class="input">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="E-mail" required>
</div>

<div class="input">
<i class="fa-solid fa-lock"></i>
<input type="password" id="senha" placeholder="Senha" required>
</div>

<div class="input">
<i class="fa-solid fa-lock"></i>
<input type="password" id="confirmar" placeholder="Confirmar Senha" required>
</div>

<button type="submit">

Cadastrar

</button>

<a href="home.html">Voltar para Login</a>

</form>

</div>

</div>

<script src="cadastro.js"></script>

</body>
</html>
